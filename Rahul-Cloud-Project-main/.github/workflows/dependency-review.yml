name: Dependency Review

# OWASP-style dependency scanning: flags known-vulnerable packages introduced
# by a pull request. Informational (warn) to match the project's audit policy —
# a new upstream advisory won't block merges, but it is surfaced on the PR.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Scan dependencies for known vulnerabilities
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
