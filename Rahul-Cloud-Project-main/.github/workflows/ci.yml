name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Express API)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: userhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/userhub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Lint (ESLint — blocking)
        run: npm run lint
        working-directory: backend

      - name: Format check (Prettier — informational)
        run: npm run format:check
        working-directory: backend
        continue-on-error: true

      # Five test tiers, run individually so each tier's result is visible.
      - run: npm run test:unit
        working-directory: backend
      - run: npm run test:integration
        working-directory: backend
      - run: npm run test:functional
        working-directory: backend
      - run: npm run test:smoke
        working-directory: backend
      - run: npm run test:system
        working-directory: backend

      - name: Coverage (c8 — blocks below 80%)
        run: npm run test:coverage
        working-directory: backend

      - name: Security audit (npm audit — informational)
        run: npm audit --audit-level=high
        working-directory: backend
        continue-on-error: true

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore

  frontend:
    name: Frontend (React client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      - name: Lint (ESLint + jsx-a11y — blocking)
        run: npm run lint
        working-directory: frontend

      - name: Format check (Prettier — informational)
        run: npm run format:check
        working-directory: frontend
        continue-on-error: true

      # Test tiers, run individually so each tier's result is visible.
      - run: npm run test:unit
        working-directory: frontend
      - run: npm run test:integration
        working-directory: frontend
      - run: npm run test:functional
        working-directory: frontend
      - run: npm run test:smoke
        working-directory: frontend
      - name: Accessibility tests (axe-core)
        run: npm run test:a11y
        working-directory: frontend

      - name: Coverage (v8 — blocks below 80% on critical paths)
        run: npm run test:coverage
        working-directory: frontend

      - name: Security audit (npm audit — informational)
        run: npm audit --audit-level=high
        working-directory: frontend
        continue-on-error: true

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: ignore

  deploy:
    name: Deploy (Render)
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
      - name: Trigger frontend deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"

  post-deploy-smoke:
    name: Post-deploy smoke test
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Free-tier deploys can be slow/cold; never fail the pipeline on this — it is
    # automated deployment evidence, not a gate.
    continue-on-error: true
    env:
      API_URL: ${{ vars.API_URL }}
      WEB_URL: ${{ vars.WEB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for the API to come back healthy
        run: |
          API="${API_URL:-https://backend-api-haz9.onrender.com}"
          echo "Waiting for $API/health ..."
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$API/health" || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "API did not become healthy in time (deploy may still be in progress)."

      - name: Run deployed smoke test
        run: node scripts/smoke-deployed.js
        working-directory: backend
